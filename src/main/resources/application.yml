spring:
  application:
    name: centinela-monitor

  # ---- PostgreSQL: registro inmutable de eventos (Fase 2) ----
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/centinela}
    username: ${POSTGRES_USER:centinela}
    password: ${POSTGRES_PASSWORD:centinela-local}

  jpa:
    # El esquema lo gobierna Flyway; Hibernate solo valida que coincida.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    # db/seed trae los datos de desarrollo (V4). En produccion basta con
    # FLYWAY_LOCATIONS=classpath:db/migration para que nunca se apliquen.
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/seed}
    # Si una ubicacion no existe queremos enterarnos, no seguir en silencio.
    fail-on-missing-locations: true

  # ---- Redis: last_seen del vigilante de silencio, rate-limit e idempotencia de borde ----
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      # Fiabilidad: no queremos perder una alerta critica.
      acks: all
      retries: 5
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: centinela-alert-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: "com.rmsolutions.centinela.ingestion.domain"
        spring.json.value.default.type: "com.rmsolutions.centinela.ingestion.domain.OsdEvent"
        # Ignoramos la cabecera __TypeId__ que escribe el productor y usamos SIEMPRE
        # el tipo de arriba. Sin esto, un mensaje publicado antes de un renombrado de
        # paquete (o por otro productor) revienta al deserializar y el evento se pierde.
        # En un sistema fail-safe el consumidor no puede depender del nombre de clase
        # que traia el mensaje: el contrato es el JSON, no el FQN de Java.
        spring.json.use.type.headers: false
    listener:
      # Confirmamos offset por registro procesado (mas seguro para alertas).
      ack-mode: record

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true   # habilita /actuator/health/liveness y /readiness (Azure)

# ---- Configuracion de negocio de Centinela ----
app:
  # Identificador del nino monitoreado; se usa como clave de particion en Kafka
  # para garantizar orden por-persona. En multi-paciente vendria del payload/token.
  child-id: ${CHILD_ID:child-001}
  # Secreto compartido que valida el webhook (cabecera X-OSD-Token). CAMBIAR en prod.
  webhook-token: ${WEBHOOK_TOKEN:dev-local-secret-change-me}
  # Umbral de bateria baja (%) que dispara una advertencia derivada.
  low-battery-threshold: 15
  # Debe coincidir con la zona del celular que corre OSD.
  osd-time-zone: ${OSD_TIME_ZONE:America/Lima}

  simulator:
    target-url: ${SIM_TARGET_URL:http://localhost:8080/api/v1/osd/events}
    interval-ms: 2000
    event-count: 30          # -1 para bucle infinito
    scenario: SEIZURE        # NORMAL | SEIZURE | FALL | LOW_BATTERY | DISCONNECT | RANDOM

logging:
  level:
    com.rmsolutions.centinela: INFO
